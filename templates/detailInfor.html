<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lý Lịch Nghĩa Vụ Quân Sự - Mẫu</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.6;
            margin: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header p {
            margin: 0;
            line-height: 1.2;
        }
        .title {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
        }
        .section-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .info-item {
            margin-bottom: 8px;
        }
        /* Đã thêm font-size: 0.9em; vào đây */
        .placeholder-input {
            border: none;
            border-bottom: 1px dotted #000;
            padding: 0 5px;
            min-width: 50px;
            display: inline-block;
            font-family: inherit;
            /* ĐIỀU CHỈNH KÍCH THƯỚC CHỮ TẠI ĐÂY */
            font-size: 0.9em; 
        }
        .line-full {
            width: 60%;
        }
        /* Custom size adjustments for inputs */
        input[name*="ngay"], input[name*="thang"] { width: 40px; }
        input[name*="nam"] { width: 60px; }
        input[name*="cccd"] { width: 250px; }
        input[name*="diachi"] { width: 500px; }
        button[type="submit"] {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 3em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <p><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong></p>
        <p><strong>Độc lập - Tự do - Hạnh phúc</strong></p>
        <hr style="width: 30%; margin: 5px auto;">
    </div>

    <div class="title">NGHĨA VỤ QUÂN SỰ</div>

    <form action="/submit-military-data" method="POST">

        <div class="section-title">I. SƠ YẾU LÝ LỊCH</div>
        {% for key in config["columnList"] %}
        <div class="info-item">{{ config[key]['Question'].replace("\n","") }}: 
            {% set columnLable = config[key]['ColumnLabel'] %}
            <input type="text" name="{{ key }}" value="{{ obj[key] }}" class="placeholder-input line-full" required>
        </div>
        {% endfor %}
        <p style="text-align: center;">
            <button id="myButton" type="submit">Gửi dữ liệu</button>
        </p>
    </form>
    </body>
</html>
