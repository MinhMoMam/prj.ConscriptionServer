<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Layer Example</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Times New Roman", Times, serif;
      }
      .scene {
        position: relative;
        height: 100vh;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      .text-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 48px;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
        text-align: center;
        padding: 0 24px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="text-layer">Your Text Goes Here</div>
    </div>
  </body>
</html>
