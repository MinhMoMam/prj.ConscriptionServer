<!DOCTYPE html>
<html>
<head>
    <title>Danh sách + Thanh tìm kiếm</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
      html,
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      /* Background Image Link */
      background-image: url("/static/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: repeat;

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* White page container */
    .page {
      width: 75vw;       /* 90% of screen width */
      height: 95vh;     /* full screen height */
      background: rgba(255, 255, 255, 0.90);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3);
      overflow-y: auto;  /* scroll if content is too much */
    }

    /* Sub divs inside the white page */
    .sub-box {
      background: #f2f2f2;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
    }

    .sub-box h2 {
      margin: 0 0 10px;
    }

    .login-container {
      width: 250px;
      margin: auto;
      text-align: center;
      margin-top: 100px;
    }

    .login-container input {
      width: 100%;        /* same width */
      padding: 8px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    .login-container button {
      width: 100%;
      padding: 8px;
    }

    </style>
</head>
<body>
    <div class="page">
    <h1>Đăng nhập</h1>
        <div class="login-container">

            <input id="username" type="text" placeholder="Username"><br>
            <input id="password" type="password" placeholder="Password"><br>

            <button type="button" onclick="Login()">Login</button>
        </div>
    <div id="toast"></div>
    <!-- Link external JS -->
    <script src="/static/rootScript.js"></script>
    </div>
</body>
</html>
